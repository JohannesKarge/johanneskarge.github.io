# Jekyll configuration for Johannes Karge's academic website
title: Johannes Karge
description: PhD Candidate at Paris School of Economics and EHESS; Junior Research Economist at Banque de France.
author: Johannes Karge
email: johannes.karge@psemail.eu
url: https://johanneskarge.github.io

markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

linkedin_username: johannes-karge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_DEPLOY.md
  - WEBSITE_CONTENT_GUIDE.md
  - .gitignore
  - vendor

collections:
  research:
    output: true
    permalink: /research/:name

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
