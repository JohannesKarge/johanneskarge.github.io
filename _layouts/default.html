<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container site-nav">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#research">Research</a>
        <a href="{{ site.data.profile.cv | relative_url }}?v={{ site.data.profile.cv_version }}" target="_blank" rel="noopener">CV</a>
        <a href="{{ '/' | relative_url }}#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

 <footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-meta">
      <span>© {{ 'now' | date: '%Y' }} {{ site.author }}</span>
      <a href="mailto:{{ site.data.profile.email }}">{{ site.data.profile.email }}</a>
    </div>

    <p class="disclaimer">
      The views expressed are those of the author and should under no circumstances be interpreted as reflecting those of the Banque de France or the Eurosystem.
    </p>
  </div>
</footer>
</body>
</html>
