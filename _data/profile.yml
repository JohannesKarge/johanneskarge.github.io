summary:  I am a PhD candidate at Paris School of Economics and the École des hautes études en sciences sociales, as well as a junior research economist at Banque de France. I am passionate about macroeconomics, financial stability, corporate finance, banking, economic history, and climate risk. I am also affiliated with the Center for Economic and Social History François Simiand through my research. Previously, I worked at the European Central Bank in banking supervision and climate-financial risk analysis. I hold master’s degrees in economics from Nova School of Business and Economics in Portugal and Tilburg University in the Netherlands. During my undergraduate studies at the Free University of Berlin, I also spent a year at the Athens University of Economics and Business in Greece. I have a strong interest in applied econometrics and data analysis using R, Python, and Stata.
  
