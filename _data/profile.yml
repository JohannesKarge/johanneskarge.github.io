summary: |
  "I am a PhD candidate at Paris School of Economics and junior research economist at Banque de France focusing on macroeconomics, financial stability, corporate debt and finance, banking, economic history and climate risk. Previously, I worked at the European Central Bank within banking supervision and climate-financial risk analysis. I hold master's degrees in Economics from Nova School of Business and Economics (Portugal) and Tilburg University (Netherlands) and have a passion for econometrics and data analysis using R, Python and Stata."

