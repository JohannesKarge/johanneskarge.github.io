    description: |
      I estimate a Bayesian FAVAR model for the Euro Area to investigate the impact of supply and demand shocks to private sector debt on the currency block's macroeconomic dynamics. The approach has the advantage to study the shocks' repercussions on a wide range of variables. I identify the shocks via sign restrictions on private sector debt and on an interest rate spread. I find that while positive supply debt shocks have no effects on the Euro Area's macroeconomy, positive demand shocks have negative macroeconomic impacts on various macroeconomic variables. My findings imply that correctly uncovering whether debt shocks are supply or demand driven is crucial for optimal macroprudential policy responses.

      Master Thesis at Nova SBE written under the supervision of Assistant Professor Joao B. Duarte, Ph.D. Currently I am preparing an extended version which I already presented at the ECB Internal Banking Supervision Research Seminar in June 2022.

