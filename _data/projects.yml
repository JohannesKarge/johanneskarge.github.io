intro: >
  My work studies the interaction of financial systems, corporate debt, and macroeconomic outcomes across long historical horizons and contemporary data.

projects:
  - title: "Bonds, Business Cycles and Financial Crises"
    status: "Job market paper"
    authors: "Johannes Karge"
    featured: true
    links:
      - label: "Latest version"
        url: "/assets/JMP_Bonds_Karge.pdf"
    abstract: >
      Do corporate bond markets function as an aggregate “spare tire” when banks are impaired? I study this question using a new long-run dataset of primary bond issuance by issuer sector for 19 countries from the nineteenth century to the present. The data distinguish non-financial corporations, financial corporations, and governments, allowing me to trace how primary bond-market financing is reallocated during systemic banking crises. I find that non-financial corporate bond issuance contracts sharply and persistently after crisis onset rather than expanding to replace impaired bank lending. Three years after a crisis, issuance is roughly one-half below its pre-crisis level, while government issuance rises strongly and financial-sector issuance increases only temporarily. The contraction remains pronounced when issuance is scaled by GDP, investment, or pre-crisis bank credit, and is stable across historical periods, crisis definitions, and alternative specifications. Combining the issuance data with historical credit spreads shows that crises accompanied by larger credit-market repricing experience substantially deeper subsequent contractions in non-financial corporate issuance, consistent with tighter market conditions contributing to the decline. Countries with deeper pre-crisis bond markets subsequently experience stronger investment recovery, but this relationship is not distinctly stronger during banking crises. The results reveal an aggregation wedge between firm-level substitution and aggregate financing: selected firms may retain access to bond markets when banks retrench, but this margin is not large enough to stabilize non-financial corporate financing in systemic crises.
    tags:
      - Corporate bond markets
      - Financial crises
      - Long-run data
      - Macro & Corporate Finance

  - title: "French Banking: A Long-Run Perspective since the Belle Époque"
    status: "Work in progress"
    authors: "with Eric Monnet, Kaspar Zimmermann and Angelo Riva"
    abstract: >
      This project develops a long-run perspective on the French banking system. It brings together historical sources and modern data to document changes in the size, structure, and composition of banks and their balance sheets across major institutional and macroeconomic transformations. We provide new empirical evidence on how the organisation of banking and credit has evolved in France using unique bank-level balance-sheet data since the early twentieth century.
    tags:
      - French banking
      - Financial history
      - Long-run data
      - Credit institutions

  - title: "The Nexus of Corporate Debt and Investment: An Analysis for France"
    status: "Work in progress"
    authors: "with Urszula Szczerbowicz"
    abstract: >
      How does corporate indebtedness shape firms’ investment responses? This project examines the relationship between corporate debt and investment in France, focusing on how firm-level indebtedness influences the transmission of financial conditions to real activity. It aims to distinguish, in a causal manner, the role of debt as a financing instrument from its role as a constraint by relying on a novel instrumental-variables approach.
    tags:
      - Corporate debt
      - Investment
      - France
      - Financial conditions