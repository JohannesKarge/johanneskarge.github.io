  - title: "Macroeconomic Fluctuations and Private Debt in the Euro Area: A FAVAR Approach"
    start_date: "Jul 2020"
    end_date: "Dec 2020"
    duration: "6 mos"
    institution: "Nova School of Business and Economics"
    type: "Extended Master Thesis"
    supervisor: "Assistant Professor Joao B. Duarte, Ph.D."
    link: "Link to an early version of the paper"
    presentation: "ECB Internal Banking Supervision Research Seminar in June 2022"
    description: >
      I estimate a Bayesian FAVAR model for the Euro Area to investigate the impact
      of supply and demand shocks to private sector debt on the currency block's
      macroeconomic dynamics. The approach has the advantage of studying the shocks'
      repercussions on a wide range of variables. I identify the shocks via sign
      restrictions on private sector debt and on an interest rate spread. I find that
      while positive supply debt shocks have no effects on the Euro Area's macroeconomy,
      positive demand shocks have negative macroeconomic impacts. My findings imply
      that correctly uncovering whether debt shocks are supply or demand driven is
      crucial for optimal macroprudential policy responses.
    skills:
      - "Time Series Analysis"
      - "Private Sector Debt"
      - "Financial Stability"

