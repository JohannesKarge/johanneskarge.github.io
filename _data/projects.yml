  - title: "Legal Origins and Short-Run Financial and Economic Stability"
    start_date: "Mar 2019"
    end_date: "Jul 2019"
    duration: "5 mos"
    institution: "Tilburg University"
    type: "Master Thesis"
    supervisor: "Associate Professor Burak Uras, Ph.D."
    hypothesis: "Civil law origin has a business cycle dampening effect"
    description: |
      This paper bridges two lines of research. On the one hand, La Porta et al. (2008) have shown that legal origins have significant long term impacts on financial and economic development. On the other hand, a small branch of literature investigates the impact of institutional factors on business cycles. This paper researches the influence of legal origins on business cycles in a cross-country framework. The underlying hypothesis is that civil law origin has a business cycle dampening effect. I find weak evidence for my hypothesis as civil legal origin significantly impacts business cycles directly. This is also robust to the use of an alternative proxy for financial development. However, I do not find an effect when employing legal origins as instruments for financial development. The initial literature argues that their influence is likely to impact an economy indirectly via this channel.

      Master Thesis at Tilburg University written under the supervision of Associate Professor Burak Uras, Ph.D.
    key_findings:
      - "Weak evidence for hypothesis that civil legal origin impacts business cycles directly"
      - "Results robust to alternative proxy for financial development"
      - "No effect when using legal origins as instruments for financial development"
