  - title: "Credit Default and Borrower Clusters in the Prosper Loan Data Set: A Machine Learning Approach"
    start_date: "Mar 2020"
    end_date: "May 2020"
    duration: "3 mos"
    institution: "Nova School of Business and Economics"
    type: "Research Project"
