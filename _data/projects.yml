intro: >
  I study the long-run development of the financial system and how it responds to macro-financial shocks and business cycles. In my work I combine archival records
  and modern statistics to create consistent long-run data, offering new insights into how the financial system interacts with the rest of the economy, with a specific
  focus on banks, capital markets and corporate finance.

